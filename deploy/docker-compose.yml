services:
  onelight:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Compose passes exactly the keys named here, so a setting documented
    # anywhere but missing from this list is silently ignored no matter what
    # the operator puts in .env. The list is generated from
    # packages/core/src/config-manifest.ts by `pnpm config:gen`, and
    # `pnpm config:check` fails CI when the two disagree. Do not edit by hand.
    environment:
      # ONELIGHT-CONFIG:BEGIN
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      PORT: 3000
      DATABASE_PATH: /data/onelight.db
      BLOB_ROOT: /data/blobs
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ONELIGHT_ALLOWED_ORIGINS: ${ONELIGHT_ALLOWED_ORIGINS:-}
      ONELIGHT_WORKSPACE_NAME: ${ONELIGHT_WORKSPACE_NAME:-}
      ONELIGHT_ADMIN_EMAIL: ${ONELIGHT_ADMIN_EMAIL:-}
      ONELIGHT_ADMIN_PASSWORD: ${ONELIGHT_ADMIN_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET is required}
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-}
      WATERMARK_SWEEP_LIMIT: ${WATERMARK_SWEEP_LIMIT:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_INTERVAL_MS: ${BACKUP_INTERVAL_MS:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      UPLOAD_REAP_AFTER_MS: ${UPLOAD_REAP_AFTER_MS:-}
      TRASH_PURGE_AFTER_MS: ${TRASH_PURGE_AFTER_MS:-}
      ONELIGHT_GC_DELETE: ${ONELIGHT_GC_DELETE:-}
      GC_INTERVAL_MS: ${GC_INTERVAL_MS:-}
      # ONELIGHT-CONFIG:END
    volumes:
      - onelight-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  onelight-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    # The base stack stays portable. GPU override files pass the device and set
    # a strict backend so production cannot silently fall to CPU. Generated:
    # see the note on the server service above.
    environment:
      # ONELIGHT-CONFIG:BEGIN
      PORT: 8080
      ONELIGHT_SERVER_URL: ${ONELIGHT_SERVER_URL:-http://onelight:3000}
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET is required}
      MEDIA_CONCURRENCY: ${MEDIA_CONCURRENCY:-}
      ONELIGHT_HWACCEL: ${ONELIGHT_HWACCEL:-}
      ONELIGHT_VAAPI_DEVICE: ${ONELIGHT_VAAPI_DEVICE:-}
      ONELIGHT_VAAPI_LOW_POWER: ${ONELIGHT_VAAPI_LOW_POWER:-}
      ONELIGHT_NVENC_DEVICE: ${ONELIGHT_NVENC_DEVICE:-}
      ONELIGHT_SOFTWARE_AV1: ${ONELIGHT_SOFTWARE_AV1:-}
      # ONELIGHT-CONFIG:END
    # The worker opens files nobody vetted. Every asset an outside reviewer
    # uploads is parsed here by ffmpeg, Poppler, LibRaw and libheif, which is
    # a large amount of C for a stranger's bytes to reach, so the blast radius
    # of a bad decode is bounded rather than trusted.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      # A decoder that gets code execution cannot then gain privileges through
      # a setuid binary it finds in the image.
      - no-new-privileges:true
    tmpfs:
      # read_only leaves the image immutable, so the scratch these tools want
      # has to come from somewhere; bounded, so a crafted file cannot fill the
      # host by writing temporary output. /data stays writable: it is a volume,
      # and the renditions the server reads are written there.
      - /tmp:size=1g,mode=1777
    # Bounds, not budgets. A malformed file that sends a decoder into an
    # allocation loop or a fork storm stops at these instead of taking the
    # machine, and the site keeps serving. Raise the memory ceiling for very
    # large HDR or 4K work: an encode that exceeds it is killed, and the job
    # fails rather than the host suffering.
    mem_limit: ${ONELIGHT_WORKER_MEMORY:-6g}
    pids_limit: ${ONELIGHT_WORKER_PIDS:-512}
    ulimits:
      nofile:
        soft: 4096
        hard: 8192
      # No core dumps: a crash on a stranger's file would otherwise write the
      # decoded contents of that file to disk.
      core: 0
    volumes:
      - onelight-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  onelight-data:
