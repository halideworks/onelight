services:
  onelight:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    # Compose passes exactly the keys named here, so a setting documented
    # anywhere but missing from this list is silently ignored no matter what
    # the operator puts in .env. The list is generated from
    # packages/core/src/config-manifest.ts by `pnpm config:gen`, and
    # `pnpm config:check` fails CI when the two disagree. Do not edit by hand.
    environment:
      # ONELIGHT-CONFIG:BEGIN
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
      PORT: 3000
      DATABASE_PATH: /data/onelight.db
      BLOB_ROOT: /data/blobs
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      ONELIGHT_ALLOWED_ORIGINS: ${ONELIGHT_ALLOWED_ORIGINS:-}
      ONELIGHT_WORKSPACE_NAME: ${ONELIGHT_WORKSPACE_NAME:-}
      ONELIGHT_ADMIN_EMAIL: ${ONELIGHT_ADMIN_EMAIL:-}
      ONELIGHT_ADMIN_PASSWORD: ${ONELIGHT_ADMIN_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      WORKER_URL: ${WORKER_URL:-http://onelight-worker:8080}
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET is required}
      WORKER_JOB_TIMEOUT_MS: ${WORKER_JOB_TIMEOUT_MS:-}
      MEDIA_CONCURRENCY: ${MEDIA_CONCURRENCY:-}
      WATERMARK_SWEEP_LIMIT: ${WATERMARK_SWEEP_LIMIT:-}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      BACKUP_DIR: ${BACKUP_DIR:-}
      BACKUP_INTERVAL_MS: ${BACKUP_INTERVAL_MS:-}
      BACKUP_KEEP: ${BACKUP_KEEP:-}
      UPLOAD_REAP_AFTER_MS: ${UPLOAD_REAP_AFTER_MS:-}
      TRASH_PURGE_AFTER_MS: ${TRASH_PURGE_AFTER_MS:-}
      ONELIGHT_GC_DELETE: ${ONELIGHT_GC_DELETE:-}
      GC_INTERVAL_MS: ${GC_INTERVAL_MS:-}
      # ONELIGHT-CONFIG:END
    volumes:
      - onelight-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  onelight-worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    # The base stack stays portable. GPU override files pass the device and set
    # a strict backend so production cannot silently fall to CPU. Generated:
    # see the note on the server service above.
    environment:
      # ONELIGHT-CONFIG:BEGIN
      PORT: 8080
      WORKER_SECRET: ${WORKER_SECRET:?WORKER_SECRET is required}
      ONELIGHT_HWACCEL: ${ONELIGHT_HWACCEL:-}
      ONELIGHT_VAAPI_DEVICE: ${ONELIGHT_VAAPI_DEVICE:-}
      ONELIGHT_VAAPI_LOW_POWER: ${ONELIGHT_VAAPI_LOW_POWER:-}
      ONELIGHT_NVENC_DEVICE: ${ONELIGHT_NVENC_DEVICE:-}
      ONELIGHT_SOFTWARE_AV1: ${ONELIGHT_SOFTWARE_AV1:-}
      # ONELIGHT-CONFIG:END
    volumes:
      - onelight-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  onelight-data:
