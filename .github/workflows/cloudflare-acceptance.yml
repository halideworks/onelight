# The acceptance criterion for P0-2, and the only job that touches a real
# Cloudflare account.
#
# Everything provable without one is proved without one: the workers-pool suite
# runs the job protocol under miniflare on every push, with no credentials and
# no cost. What that cannot tell us is whether the deployed thing works, and
# that gap is the whole point of the item -- the Workers target was claimed to
# serve the app for a year while being unable to produce a single rendition,
# and nothing in CI noticed, because nothing in CI had ever deployed it.
#
# So this deploys, uploads through the deployment, kills the worker that is
# mid-encode, and asserts another finishes the job and the rendition decodes.
#
# It is deliberately NOT on pull_request or push. Every run creates and
# destroys real resources in a real account. Weekly, plus manual dispatch when
# a change actually touches this path.
#
# Everything it creates is named onelight-ci-<run id>, and the teardown is
# `if: always()`. Nothing already in the account is read, written, or named.
name: Cloudflare acceptance

on:
  workflow_dispatch:
  # Weekly rather than per-merge. Every run deploys to a real account, and a
  # run per push meant a campaign of merges queued several at once for the
  # concurrency group to cancel each other -- churn that proved nothing. A
  # standing weekly run still keeps the claim from rotting silently, and the
  # dispatch is there for the merge that actually changes this path.
  schedule:
    - cron: "17 6 * * 1"

# One at a time: two runs would deploy different Workers fine, but the account
# is shared with real deployments and there is no reason to have several
# throwaway ones alive at once.
concurrency:
  group: cloudflare-acceptance
  cancel-in-progress: false

jobs:
  acceptance:
    runs-on: ubuntu-latest
    # Long enough for a deploy, three worker images, and a 1080p encode that
    # gets killed and redone, and short enough that a hang cannot leave
    # resources alive for hours.
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_SECRET: acceptance-only-worker-secret-0123456789
      SECRET_KEY: acceptance-only-secret-key-0123456789abcdefghij
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg fonts-dejavu-core
      - run: pnpm install --frozen-lockfile

      # Refuse to start rather than half-create resources with no credentials.
      - name: Require credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "CLOUDFLARE_API_TOKEN is not set"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "CLOUDFLARE_ACCOUNT_ID is not set"; exit 1; }

      - name: Name this run's resources
        run: echo "CI_NAME=onelight-ci-${{ github.run_id }}" >> "$GITHUB_ENV"

      # The SPA build resolves @onelight/core through its package exports, so
      # the workspace packages have to be built first or vite dies with
      # "failed to resolve entry for package". The node job gets this for free
      # because typecheck runs ahead of it; nothing here did.
      - run: pnpm typecheck

      # The Worker serves the SPA from this directory, so it has to exist
      # before the deploy even though no browser drives it here.
      - run: pnpm --filter @onelight/web build

      # Created before the deploy because the config needs the database's id.
      # From here on the teardown step is what removes them, and it runs even
      # if any of the following fails.
      - name: Create the D1 database and the R2 bucket
        run: |
          pnpm exec wrangler d1 create "$CI_NAME"
          pnpm exec wrangler r2 bucket create "$CI_NAME"
          # R2 refuses to delete a bucket that still holds objects, and this
          # run puts renditions in it. A one-day expiry means a bucket empties
          # itself even if the job is killed before the teardown runs, so a
          # sweep can remove it afterwards.
          pnpm exec wrangler r2 bucket lifecycle add "$CI_NAME" \
            --name expire-ci-objects --expire-days 1 --abort-multipart-days 1 -y || true
          database_id=$(pnpm exec wrangler d1 info "$CI_NAME" --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const j=JSON.parse(s.slice(s.indexOf("{")));const id=j.uuid??j.database_id;if(!id)throw new Error("no uuid in d1 info output");process.stdout.write(id)})')
          test -n "$database_id" || { echo "could not read the database id"; exit 1; }
          echo "CI_DATABASE_ID=${database_id}" >> "$GITHUB_ENV"

      - name: Write the deployment config
        run: |
          node scripts/cloudflare-acceptance-config.mjs \
            --name "$CI_NAME" \
            --database-id "$CI_DATABASE_ID" \
            --bucket "$CI_NAME" \
            --out wrangler.ci.json
          cat wrangler.ci.json

      - name: Deploy
        run: |
          pnpm exec wrangler deploy -c wrangler.ci.json 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url" || { echo "the deploy printed no workers.dev URL; is the subdomain enabled on this account?"; exit 1; }
          echo "CI_URL=${url}" >> "$GITHUB_ENV"
          echo "deployed to ${url}"

      # Secrets rather than vars: a var is in the config file, and the config
      # file is an artifact of the run. PUBLIC_URL can only be set now, because
      # the URL did not exist until the deploy printed it.
      - name: Configure the deployment
        run: |
          printf '%s' "$SECRET_KEY" | pnpm exec wrangler secret put SECRET_KEY --name "$CI_NAME"
          printf '%s' "$WORKER_SECRET" | pnpm exec wrangler secret put WORKER_SECRET --name "$CI_NAME"
          printf '%s' "$CI_URL" | pnpm exec wrangler secret put PUBLIC_URL --name "$CI_NAME"

      # No schema step: the Worker applies its own migrations on the first
      # request, memoized per binding, and that is how every real deployment
      # gets its schema. `wrangler d1 migrations apply` is a different code
      # path that cannot parse these files -- it answered "incomplete input:
      # SQLITE_ERROR 7500" -- and using it here would have tested a path
      # production does not take.

      # Before any media: prove the deployment is up and that the worker
      # surface is mounted on it. A 401 means the route ran and refused the
      # signature; a 404 would mean the protocol never reached this target,
      # which is the failure this whole phase exists to make impossible.
      - name: The deployment answers, and speaks the worker protocol
        run: |
          # A freshly deployed workers.dev route is not live at every edge at
          # once. The first run of this saw 404, then 200, then "error code:
          # 1042", then 200 again within twenty seconds -- the same URL
          # answering differently depending on which PoP took the request.
          #
          # So readiness is three consecutive good answers, not one. A single
          # success proves only that one PoP has the route, and the next
          # request is a coin toss.
          good=0
          for attempt in $(seq 1 60); do
            body=$(curl -s "$CI_URL/healthz" || true)
            case "$body" in
              *1042*|"") good=0 ;;
              *) good=$((good + 1)) ;;
            esac
            [ "$good" -ge 3 ] && break
            echo "healthz not settled yet (attempt ${attempt}, consecutive ok ${good}): ${body:0:60}"
            sleep 5
          done
          test "$good" -ge 3 || { echo "the deployment never answered consistently"; exit 1; }
          echo "healthz settled after ${attempt} attempts"

          # And settle on the path this actually uses. /healthz being stable
          # does not mean /api/* is: run 7 answered an unsigned claim with 401
          # while run 9, on the same code, answered 404 minutes after healthz
          # had settled three times over. The worker-first routes propagate on
          # their own schedule, so the endpoint under test is the one to wait
          # for.
          claimed=0
          for attempt in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$CI_URL/api/v1/worker/claim" \
              -H 'content-type: application/json' \
              -H "x-onelight-signature: $(printf '0%.0s' $(seq 1 64))" \
              -d '{"worker_id":"probe","capabilities":["cpu"],"timestamp":0}' || true)
            if [ "$code" = "401" ]; then
              claimed=$((claimed + 1))
            else
              claimed=0
            fi
            [ "$claimed" -ge 20 ] && break
            [ $((attempt % 5)) -eq 0 ] && echo "claim not settled yet (attempt ${attempt}, consecutive 401s ${claimed}): ${code}"
            sleep 3
          done
          test "$claimed" -ge 20 || { echo "the worker protocol never answered consistently"; exit 1; }
          echo "claim settled after ${attempt} attempts"
          # And what came back, not just that something did: the assets layer
          # can answer a GET with index.html, which is also a 200.
          health=$(curl -s "$CI_URL/healthz" || true)
          echo "healthz body: ${health}"
          case "$health" in
            *"<html"*|*"<!DOCTYPE"*|*"<!doctype"*)
              echo "the assets layer answered /healthz, so the Worker is not being invoked"
              exit 1
              ;;
          esac
          # One more, for the body. Retried, because the edge answers this as a
          # lottery rather than a settling window: run 10 got three consecutive
          # 401s and then a 1042 milliseconds later. Individual colos learn the
          # workers.dev route independently, so any single request can miss
          # regardless of how many before it hit.
          for attempt in $(seq 1 10); do
            claim=$(curl -s -w '\n%{http_code}' -X POST "$CI_URL/api/v1/worker/claim" \
              -H 'content-type: application/json' \
              -H "x-onelight-signature: $(printf '0%.0s' $(seq 1 64))" \
              -d '{"worker_id":"probe","capabilities":["cpu"],"timestamp":0}')
            body=$(echo "$claim" | head -n -1)
            code=$(echo "$claim" | tail -1)
            case "$body" in *1042*) ;; *) break ;; esac
            echo "edge missed the route (attempt ${attempt}); retrying"
            sleep 5
          done
          # The body, not just the status. A 500 here says only that something
          # threw; what it says is the difference between one more run and a
          # guess, and the Worker is deleted at the end of this job so there is
          # nothing left to tail afterwards.
          echo "unsigned claim: ${code}"
          echo "body: ${body}"
          test "$code" != "404" || { echo "the worker routes are not mounted on the deployment"; exit 1; }
          test "$code" = "401" || { echo "expected 401 from an unsigned claim, got ${code}"; exit 1; }

      # What the Worker itself logged, for the request that failed.
      #
      # `wrangler tail` only reports invocations that happen while it is
      # connected, so tailing after the fact showed a successful connection and
      # then nothing at all. The request has to be made again with the tail
      # already listening.
      #
      # Silence here is itself the answer: if a claim returns an error and the
      # Worker logs no invocation for it, the request never reached our code
      # and the problem is edge routing rather than anything in the handler.
      - name: Deployment logs for a repeated claim
        if: failure()
        run: |
          pnpm exec wrangler tail "$CI_NAME" --format json > tail.log 2>&1 &
          tail_pid=$!
          sleep 8
          echo "--- healthz (known good) ---"
          curl -s -o /dev/null -w '%{http_code}\n' "$CI_URL/healthz" || true
          echo "--- claim (the failing one) ---"
          curl -s -w '\n%{http_code}\n' -X POST "$CI_URL/api/v1/worker/claim" \
            -H 'content-type: application/json' \
            -H "x-onelight-signature: $(printf '0%.0s' $(seq 1 64))" \
            -d '{"worker_id":"probe","capabilities":["cpu"],"timestamp":0}' || true
          sleep 8
          kill $tail_pid 2>/dev/null || true
          echo "--- what the Worker logged ---"
          cat tail.log || true
          echo "--- invocations seen ---"
          grep -c outcome tail.log || echo 0

      # Three workers, no volume between them and nothing local to claim from:
      # the only way any byte moves is over the signed URLs the deployment
      # hands out.
      - name: Start three media workers against the deployment
        env:
          ONELIGHT_SERVER_URL: ${{ env.CI_URL }}
        run: |
          docker compose -f deploy/docker-compose.cf-workers.yml up -d --build \
            --scale onelight-worker-cf=3 --wait --wait-timeout 300

      # Tailed throughout, because the Worker's own exception is the only thing
      # that explains a 500 from the API, and the Worker is deleted when this
      # job ends. Guessing from status codes has cost several runs already.
      - name: Upload, kill a worker mid-encode, and play what comes back
        env:
          ONELIGHT_E2E_URL: ${{ env.CI_URL }}
          ONELIGHT_E2E_WORKER_KILL: "1"
          ONELIGHT_E2E_COMPOSE_FILE: deploy/docker-compose.cf-workers.yml
        run: |
          # The tail runs in the FOREGROUND under `timeout`, and the exercise
          # runs behind it. The other way round produced a zero-byte log:
          # wrangler buffers when stdout is not a terminal, and SIGTERM
          # discards what it has not flushed. A process that exits on its own
          # flushes; one that is killed does not.
          set +e
          ( sleep 6; node scripts/integration-e2e.mjs; echo $? > e2e-status ) &
          exercise_pid=$!
          stdbuf -oL -eL timeout 900 pnpm exec wrangler tail "$CI_NAME" --format json > exercise-tail.log 2>&1 &
          tail_pid=$!
          wait $exercise_pid
          sleep 4
          kill -INT $tail_pid 2>/dev/null || true
          wait $tail_pid 2>/dev/null
          status=$(cat e2e-status 2>/dev/null || echo 1)
          set -e
          if [ "$status" -ne 0 ]; then
            # wrangler tail --format json pretty-prints across lines, so
            # patterns written for compact JSON match nothing and look exactly
            # like a Worker that logged nothing. Print the log and let it
            # speak.
            echo "--- tail log size ---"
            wc -c exercise-tail.log || true
            echo "--- outcomes ---"
            grep -oE '"outcome":[[:space:]]*"[a-zA-Z]*"' exercise-tail.log | sort | uniq -c || true
            echo "--- exceptions ---"
            grep -A 6 '"exceptions"' exercise-tail.log | head -40 || true
            echo "--- whole tail ---"
            head -c 20000 exercise-tail.log || true
          fi
          exit $status

      # Best effort: this also runs when the failure happened before any stack
      # existed, and an empty `docker compose logs` must not add a second
      # failure to a run that already has one.
      # ONELIGHT_SERVER_URL is required by the compose file's interpolation, so
      # without it here `docker compose logs` refuses to read its own file and
      # the media workers stay silent exactly when they are the thing to ask.
      - name: Worker logs
        if: failure()
        env:
          ONELIGHT_SERVER_URL: ${{ env.CI_URL }}
        run: docker compose -f deploy/docker-compose.cf-workers.yml logs --tail 400 || true

      # Always, including on cancellation: what this created must not outlive
      # the run. Each delete tolerates the resource being absent, so a failure
      # before creation does not turn the teardown itself into the error.
      - name: Delete everything this run created
        if: always()
        run: |
          ONELIGHT_SERVER_URL="${CI_URL:-http://unused}" \
            docker compose -f deploy/docker-compose.cf-workers.yml down -v || true
          if [ -n "${CI_NAME:-}" ]; then
            pnpm exec wrangler delete --name "$CI_NAME" --force || true
            pnpm exec wrangler d1 delete "$CI_NAME" -y || true
            pnpm exec wrangler r2 bucket delete "$CI_NAME" || true
            echo "removed ${CI_NAME}"
          fi
          # Sweep anything an earlier run could not remove. A bucket holding
          # objects cannot be deleted, and run 30869917850 was the first to get
          # far enough to store renditions, so it was left behind while every
          # run before it had emptied trivially. Each stale bucket gets the
          # expiry rule and a delete attempt; once expiry has emptied it, a
          # later sweep finishes the job.
          for stale in $(pnpm exec wrangler r2 bucket list 2>/dev/null \
            | grep -oE 'onelight-ci-[0-9]+' | sort -u); do
            [ "$stale" = "${CI_NAME:-}" ] && continue
            echo "sweeping ${stale}"
            pnpm exec wrangler r2 bucket lifecycle add "$stale" \
              --name expire-ci-objects --expire-days 1 --abort-multipart-days 1 -y || true
            pnpm exec wrangler r2 bucket delete "$stale" || echo "  ${stale} still has objects; expiry will empty it"
          done

      - name: Confirm nothing was left behind
        if: always()
        run: |
          if [ -n "${CI_NAME:-}" ]; then
            pnpm exec wrangler d1 list --json | grep -q "\"$CI_NAME\"" \
              && { echo "the D1 database ${CI_NAME} still exists"; exit 1; } || true
            echo "no ${CI_NAME} D1 database remains"
          fi
          # Report every CI bucket still present rather than only this run's,
          # so a leak is visible in the run that caused it instead of being
          # found weeks later by looking at the account.
          echo "--- onelight-ci buckets still in the account ---"
          pnpm exec wrangler r2 bucket list 2>/dev/null \
            | grep -oE 'onelight-ci-[0-9]+' | sort -u || echo "(none)"
